[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nonprofit-receipt-service"
version = "0.1.0"
description = "Typed nonprofit email workflows for receipts, volunteer reminders, and campaign reports."
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/nonprofit_mail"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
